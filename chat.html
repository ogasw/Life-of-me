extends "base.html" %}
{% block content %}
<h2>Chat with {{ receiver.username }}</h2>
<div>
    {% for message in messages %}
        <p><strong>{{ 'You' if message.sender_id == session['user'] else receiver.username }}:</strong> {{ message.content }}</p>
    {% endfor %}
</div>
<form method="POST">
    <input type="text" name="content" placeholder="Type your message" required>
    <button type="submit">Send</button>
</form>
{% endblock %}
