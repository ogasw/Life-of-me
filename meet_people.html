{% extends "base.html" %}
{% block content %}
<h2>Meet People</h2>
<ul>
    {% for user in users %}
        {% if user.username != current_user %}
            <li>{{ user.username }} ({{ user.email_or_number }})</li>
            <form action="/message/{{ user.id }}" method="POST">
                <button type="submit">Message</button>
            </form>
        {% endif %}
    {% endfor %}
</ul>
{% endblock %}
